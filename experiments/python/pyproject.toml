[project]
name = "diagrammari"
version = "0.0.1"
description = "Mermaid diagrams drawn by Pele, with a personal layer you edit by hand (proof of concept)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
# Node to draw headless (export); without it, set MARI_NODE or have node on the PATH.
node = ["nodejs-wheel-binaries>=22"]
# The editor widget for Jupyter and marimo.
widget = ["anywidget>=0.9"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mari"]
artifacts = ["src/mari/_lib/*", "src/mari/pele.global.js"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/mari", "nim", "hatch_build.py", "README.md"]
